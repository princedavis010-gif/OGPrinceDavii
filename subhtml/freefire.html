<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Try to open the Free Fire app instantly -->
    <meta http-equiv="refresh" content="0; url=freefire://">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fruktur:ital@0;1&family=Kavoon&family=Rubik+Dirt&family=Rubik+Doodle+Shadow&family=Rubik+Glitch&family=Rubik+Wet+Paint&display=swap"
        rel="stylesheet">
    
    <title>Open Free Fire</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            color: yellowgreen;
            height: 77.5vh;
            background-image: linear-gradient(150deg, #0f172a, #1e1b4b);
        }

        h2 {
            color: rgb(221, 187, 15);
            text-shadow: black 1px 1px;
            font-family: "Rubik Wet Paint", system-ui;
            font-weight: 1;
            font-size: 28px;
        }

        a{
            font-family: "Kavoon", system-ui;
            font-weight: 0.5;
        }

        p {
            color: rgb(19, 221, 150);
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .btn {
            display: block;
            margin: 15px 0;
            padding: 12px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-browser {
            background-color: #24292e;
            color: white;
        }
        .btn-playstore {
            background-color: #0088cc;
            color: white;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Opening Free Fire...</h2>
        <p>If the app did not open, Free Fire might not be installed on your device.</p>
        <br>
        
        <!-- Option 2: Download from Google Play Store -->
        <a href="https://play.google.com/store/apps/details?id=com.dts.freefireth" class="btn btn-playstore" target="_blank">
            Click here to download Free Fire
        </a>

        <a href="https://play.google.com/store/apps/details?id=com.dts.freefiremax" class="btn btn-browser" target="_blank">
            Click here to download Free Fire Max
        </a>
    </div>

</body>
</html>
