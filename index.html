#loader-wrapper {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;

    z-index: 99999 !important;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

body.video-loaded #loader-wrapper {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

  
.liquid-loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 20px;
  font-family: system-ui, sans-serif;
}

.loader-track {
  position: relative;
  width: 180px;
  height: 32px;
  background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
  border-radius: 16px;
  overflow: hidden;
  box-shadow:
    inset 0 2px 4px rgba(0, 0, 0, 0.6),
    0 1px 3px rgba(255, 255, 255, 0.1);
}

.liquid-fill {
  position: absolute;
  top: 2px;
  lft: 2px;
  riht: 2px;
  height: calc(100% - 4px);
  background: linear-gradient(90deg, #4f46e5, #7c3aed, #ec4899, #f59e0b);
  border-radius: 14px;
  animation:
    fillProgress 4s ease-out infinite,
    colorShift 3s linear infinite;
  box-shadow:
    0 0 12px rgba(124, 58, 237, 0.4),
    inset 0 1px 2px rgba(255, 255, 255, 0.2);
}

.loading-text {
  color: white;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 1px;
  animation: textGlow 1s ease-in-out infinite;
}

.dot {
  margin-left: 3px;
  animation: blink 1.5s infinite;
}
.dot:nth-of-type(1) {
  animation-delay: 0s;
}
.dot:nth-of-type(2) {
  animation-delay: 0.3s;
}
.dot:nth-of-type(3) {
  animation-delay: 0.6s;
}

@keyframes fillProgress {
  0% {
    width: 4px;
  }
  25% {
    width: 25%;
  }
  50% {
    width: 50%;
  }
  75% {
    width: 75%;
  }
  100% {
    width: calc(96% - 4px);
  }
}

@keyframes colorShift {
  0% {
    filter: hue-rotate(0deg) brightness(1);
  }
  33% {
    filter: hue-rotate(120deg) brightness(1.1);
  }
  66% {
    filter: hue-rotate(240deg) brightness(0.9);
  }
  100% {
    filter: hue-rotate(360deg) brightness(1);
  }
}

@keyframes textGlow {
  0%,
  100% {
    opacity: 0.7;
    text-shadow: 0 0 8px rgba(139, 92, 246, 0.3);
  }
  50% {
    opacity: 1;
    text-shadow: 0 0 16px rgba(139, 92, 246, 0.6);
  }
}

@keyframes blink {
  0%,
  50% {
    opacity: 1;
  }
  51%,
  100% {
    opacity: 0;
  }
}

    <script>
    const video = document.getElementById('bg-video');
    
    // Triggers the moment the video is ready to play
    video.addEventListener('canplay', () => {
        document.body.classList.add('video-loaded');
    });

document.querySelectorAll('a').forEach(link => {
    const destination = link.getAttribute('href');
    const targetAttr = link.getAttribute('target');
    
    if (destination) {
        link.dataset.href = destination;
        if (targetAttr) link.dataset.target = targetAttr;
        link.removeAttribute('href'); // Strips the native link attribute to kill iOS preview
        link.style.cursor = 'pointer';
    }

    link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetUrl = link.dataset.href;
        const targetType = link.dataset.target;
        
        if (targetUrl) {
            if (targetType === '_blank') {
                window.open(targetUrl, '_blank'); // Preserves new tab behavior
            } else {
                window.location.href = targetUrl; // Opens in the same tab
            }
        }
    });

    link.addEventListener('contextmenu', (e) => {
        e.preventDefault();
    });
});


</script>
